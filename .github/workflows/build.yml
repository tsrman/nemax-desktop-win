name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Тег версии для релиза (например, v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: nemax-windows.zip
            binary_name: nemax.exe
          # - os: ubuntu-latest
          #   artifact_name: nemax-linux.tar.gz
          #   binary_name: nemax

    steps:
    - uses: actions/checkout@v4

    # - name: Install Linux dependencies
    #   if: runner.os == 'Linux'
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build project
      run: cargo build --release

    # - name: Package files (Linux)
    #   if: runner.os == 'Linux'
    #   run: |
    #     mkdir release_pkg
    #     cp target/release/${{ matrix.binary_name }} release_pkg/
    #     cp -r assets data storage release_pkg/
    #     tar -czvf ${{ matrix.artifact_name }} -C release_pkg .

    - name: Package files (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir release_pkg
        cp target/release/${{ matrix.binary_name }} release_pkg/
        cp -r assets data storage release_pkg/
        7z a ${{ matrix.artifact_name }} ./release_pkg/*

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        files: ${{ matrix.artifact_name }}
        draft: false
        prerelease: false
        generate_release_notes: true