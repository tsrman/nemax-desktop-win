name: Build and Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Тег версии для релиза (например, v0.1.0)'
        required: true
        default: 'v0.1.0'
permissions:
  contents: write
jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build project
      run: cargo build --release
    - name: Package files
      shell: bash
      run: |
        mkdir release_pkg
        cp target/release/nemax.exe release_pkg/
        cp -r assets data storage release_pkg/
        7z a nemax-windows.zip ./release_pkg/*
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        files: nemax-windows.zip
        draft: false
        prerelease: false
        generate_release_notes: true

  build-linux:
    name: Build Linux + AppImage
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
          libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev \
          libpango1.0-dev libatk1.0-dev libcairo2-dev \
          fuse libfuse2

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build project
      run: cargo build --release

    # --- Обычный tar.gz ---
    - name: Package tar.gz
      run: |
        mkdir release_pkg
        cp target/release/nemax release_pkg/
        cp -r assets data storage release_pkg/
        tar -czvf nemax-linux.tar.gz -C release_pkg .

    # --- AppImage ---
    - name: Download linuxdeploy
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

    - name: Prepare AppDir
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

        # Бинарник
        cp target/release/nemax AppDir/usr/bin/nemax

        # Ресурсы — кладём рядом с бинарником чтобы относительные пути работали
        cp -r assets AppDir/usr/bin/assets
        cp -r data   AppDir/usr/bin/data
        mkdir -p AppDir/usr/bin/storage

        # Иконка
        cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/nemax.png

        # .desktop файл
        cat > AppDir/usr/share/applications/nemax.desktop << 'EOF'
        [Desktop Entry]
        Name=neMAX
        Exec=nemax
        Icon=nemax
        Type=Application
        Categories=Network;InstantMessaging;
        Comment=Лёгкий клиент для max.ru
        EOF

    - name: Build AppImage
      env:
        ARCH: x86_64
      run: |
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --output appimage
        # linuxdeploy называет файл по имени из .desktop + архитектура
        mv neMAX-x86_64.AppImage nemax-x86_64.AppImage

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        files: |
          nemax-linux.tar.gz
          nemax-x86_64.AppImage
        draft: false
        prerelease: false
        generate_release_notes: true