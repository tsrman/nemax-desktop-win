name: Build and Release

on:
  push:
    branches: [main, linux]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Тег версии для релиза'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: windows-cargo-
    - name: Build release
      run: cargo build --release
    - name: Copy WebView2Loader.dll
      shell: bash
      run: |
        DLL=$(find target/release/build/webview2-com-sys-*/out/x64 -name WebView2Loader.dll -type f | head -1)
        cp "$DLL" target/release/
    - name: Package
      shell: bash
      run: |
        mkdir release_pkg
        cp target/release/nemax.exe release_pkg/
        cp target/release/WebView2Loader.dll release_pkg/ 2>/dev/null || true
        cp -r assets data storage release_pkg/
        7z a nemax-windows.zip ./release_pkg/*
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nemax-windows
        path: nemax-windows.zip
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version }}
        files: nemax-windows.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: linux-cargo-
    - name: Build release
      run: cargo build --release
    - name: Smoke test
      run: |
        xvfb-run --auto-servernum timeout 5 target/release/nemax || true
    - name: Package
      run: |
        mkdir release_pkg
        cp target/release/nemax release_pkg/
        cp -r assets data storage release_pkg/
        tar czf nemax-linux.tar.gz -C release_pkg .
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nemax-linux
        path: nemax-linux.tar.gz
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version }}
        files: nemax-linux.tar.gz
